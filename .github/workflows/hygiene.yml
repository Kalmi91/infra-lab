name: Repo hygiene

# Cheap structural checks that keep the repository readable: Conventional
# Commits, and no file that is tracked while .gitignore claims to ignore it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No file is both tracked and ignored
        run: |
          found=$(git ls-files -i -c --exclude-standard)
          if [ -n "$found" ]; then
            echo "::error::Tracked files matched by .gitignore (either untrack them or drop the ignore rule):"
            echo "$found"
            exit 1
          fi
          echo "Clean."

      - name: Commit messages follow Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          git rev-list --no-merges "$range" > /tmp/shas || { echo "Range unavailable, skipping."; exit 0; }
          bad=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE '^(feat|fix|chore|docs|test|refactor|build|ci|perf|style|revert)(\([a-z0-9 ._+-]+\))?!?: .+'; then
              echo "::error::Not a Conventional Commit: $sha $subject"
              bad=1
            fi
          done < /tmp/shas
          [ "$bad" = "0" ] && echo "Clean."
          exit $bad
